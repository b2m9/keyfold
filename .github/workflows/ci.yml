name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        # The engines floor and the newest LTS. The floor from package.json.
        # Versions between the two are bracketed, so they are not tested.
        node-version: [22, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run check
